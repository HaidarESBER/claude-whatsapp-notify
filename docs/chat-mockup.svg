<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Illustrative WhatsApp conversation (mockup)</title>
  <rect width="420" height="640" rx="28" fill="#0b141a"/>
  <rect x="0" y="0" width="420" height="64" rx="28" fill="#202c33"/>
  <rect x="0" y="40" width="420" height="24" fill="#202c33"/>
  <circle cx="40" cy="34" r="18" fill="#6366f1"/>
  <text x="40" y="40" text-anchor="middle" font-size="16" fill="#fff">C</text>
  <text x="70" y="31" font-size="15" font-weight="700" fill="#e9edef">Claude Code</text>
  <text x="70" y="49" font-size="11" fill="#8696a0">online</text>

  <!-- bot -->
  <rect x="16" y="84" width="330" height="108" rx="10" fill="#202c33"/>
  <text x="28" y="108" font-size="13" fill="#e9edef">🔐 <tspan font-weight="700">#1</tspan> <tspan font-weight="700">my-app</tspan> wants to run</text>
  <text x="28" y="130" font-size="12" font-family="Consolas,Menlo,monospace" fill="#53bdeb">Bash: `npm test`</text>
  <text x="28" y="160" font-size="13" fill="#e9edef">Reply <tspan font-weight="700">y</tspan> to allow or <tspan font-weight="700">n</tspan> to deny.</text>

  <!-- you -->
  <rect x="330" y="206" width="74" height="38" rx="10" fill="#005c4b"/>
  <text x="367" y="231" text-anchor="middle" font-size="14" fill="#e9edef">y</text>

  <rect x="16" y="258" width="190" height="38" rx="10" fill="#202c33"/>
  <text x="28" y="282" font-size="13" fill="#e9edef">✅ #1 approved.</text>

  <!-- voice -->
  <rect x="190" y="316" width="214" height="52" rx="10" fill="#005c4b"/>
  <text x="204" y="338" font-size="13" fill="#e9edef">🎙️ ▂▃▅▂▆▃▂▅ 0:07</text>
  <text x="204" y="358" font-size="11" fill="#8696a0">voice note</text>

  <rect x="16" y="384" width="350" height="64" rx="10" fill="#202c33"/>
  <text x="28" y="408" font-size="12" font-style="italic" fill="#e9edef">🎙️ add a loading state to the login form</text>
  <text x="28" y="432" font-size="13" fill="#e9edef">🖥️ <tspan font-weight="700">#2 my-app</tspan> on it, 3 files changed…</text>

  <!-- guest -->
  <rect x="16" y="466" width="270" height="52" rx="10" fill="#202c33"/>
  <text x="28" y="488" font-size="11" font-weight="700" fill="#06cf9c">A friend</text>
  <text x="28" y="508" font-size="13" fill="#e9edef">@bot what's the capital of Peru?</text>
  <rect x="16" y="530" width="250" height="38" rx="10" fill="#202c33"/>
  <text x="28" y="554" font-size="13" fill="#e9edef">Lima. (answered with web search only)</text>

  <text x="210" y="614" text-anchor="middle" font-size="10" fill="#8696a0">Illustrative mockup, not a real screenshot</text>
</svg>
