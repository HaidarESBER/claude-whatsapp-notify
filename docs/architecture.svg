<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>claude-whatsapp-notify architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">Everything runs on your PC. Network: WhatsApp, Anthropic, and a one-time Whisper model download.</text>

  <!-- phone -->
  <rect x="30" y="200" width="150" height="100" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="105" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Your phone</text>
  <text x="105" y="262" text-anchor="middle" font-size="12" fill="#166534">WhatsApp</text>
  <text x="105" y="280" text-anchor="middle" font-size="11" fill="#166534">owner + group</text>

  <!-- whatsapp -->
  <rect x="225" y="215" width="120" height="70" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="285" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">WhatsApp</text>
  <text x="285" y="267" text-anchor="middle" font-size="12" fill="#475569">servers</text>

  <!-- PC boundary -->
  <rect x="385" y="78" width="545" height="424" rx="14" fill="none" stroke="#6366f1" stroke-dasharray="7 5"/>
  <text x="402" y="100" font-size="12" font-weight="700" fill="#4f46e5">YOUR PC (localhost only)</text>

  <!-- server -->
  <rect x="410" y="200" width="190" height="100" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="505" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">server.js</text>
  <text x="505" y="252" text-anchor="middle" font-size="12" fill="#3730a3">Baileys client</text>
  <text x="505" y="270" text-anchor="middle" font-size="12" fill="#3730a3">HTTP API</text>
  <text x="505" y="287" text-anchor="middle" font-size="11" fill="#4338ca">127.0.0.1:3737</text>

  <!-- consumers -->
  <rect x="690" y="115" width="215" height="74" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="797" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">hook.js</text>
  <text x="797" y="161" text-anchor="middle" font-size="11" fill="#475569">Notification / Stop / PermissionRequest</text>
  <text x="797" y="177" text-anchor="middle" font-size="11" fill="#475569">hooks of any Claude Code run</text>

  <rect x="690" y="205" width="215" height="74" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="797" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">channel.js (MCP)</text>
  <text x="797" y="251" text-anchor="middle" font-size="11" fill="#475569">inside each live "claude-wa" window</text>
  <text x="797" y="267" text-anchor="middle" font-size="11" fill="#475569">messages in via SSE, replies out</text>

  <rect x="690" y="295" width="215" height="74" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="797" y="321" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">claude -p (owner)</text>
  <text x="797" y="341" text-anchor="middle" font-size="11" fill="#475569">background run per message</text>
  <text x="797" y="357" text-anchor="middle" font-size="11" fill="#475569">+ Claude in Chrome, uploads</text>

  <rect x="690" y="385" width="215" height="90" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="797" y="411" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">claude -p (guests)</text>
  <text x="797" y="431" text-anchor="middle" font-size="11" fill="#92400e">WebSearch only, no settings/MCP,</text>
  <text x="797" y="447" text-anchor="middle" font-size="11" fill="#92400e">empty folder, own conversation</text>
  <text x="797" y="463" text-anchor="middle" font-size="11" fill="#92400e">only when @mentioned</text>

  <!-- transcribe -->
  <rect x="410" y="360" width="190" height="64" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="505" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">transcribe.js</text>
  <text x="505" y="406" text-anchor="middle" font-size="11" fill="#475569">ffmpeg + Whisper, offline</text>

  <!-- arrows -->
  <line x1="180" y1="250" x2="223" y2="250" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="345" y1="250" x2="408" y2="250" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="600" y1="235" x2="688" y2="160" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="600" y1="250" x2="688" y2="244" stroke="#64748b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="600" y1="270" x2="688" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="300" x2="688" y2="415" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="505" y1="300" x2="505" y2="358" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <text x="105" y="330" text-anchor="middle" font-size="11" fill="#64748b">text, images,</text>
  <text x="105" y="345" text-anchor="middle" font-size="11" fill="#64748b">files, voice</text>
</svg>
